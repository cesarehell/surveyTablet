<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pregunta NPS Mr. Restaurant</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&amp;family=Nunito:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#0E4C75", // Deep Blue from logo background
                        secondary: "#FF453A", // Red from hair
                        cream: "#FFF6D6", // Cream from face
                        accent: "#9CD99A", // Green from bow tie
                        "background-light": "#F5F7FA",
                        "background-dark": "#0B3958", // Darker version of primary
                    },
                    fontFamily: {
                        display: ["Fredoka", "sans-serif"],
                        body: ["Nunito", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "16px",
                        'xl': "24px",
                        '2xl': "32px",
                    },
                    boxShadow: {
                        'soft': '0 10px 40px -10px rgba(0,0,0,0.08)',
                        'inner-soft': 'inset 0 2px 4px 0 rgba(0, 0, 0, 0.06)',
                    }
                },
            },
        };
    </script>
<style>.nps-btn.selected {
            background-color: #0E4C75;
            color: #FFF6D6;
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(14, 76, 117, 0.3);
        }
        .dark .nps-btn.selected {
            background-color: #FFF6D6;
            color: #0E4C75;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col font-body antialiased transition-colors duration-300">
<div class="w-full h-12 flex justify-between items-center px-6 text-gray-800 dark:text-white shrink-0">
<span class="text-sm font-semibold">9:41</span>
<div class="flex space-x-2 text-sm">
<span class="material-icons text-base">signal_cellular_alt</span>
<span class="material-icons text-base">wifi</span>
<span class="material-icons text-base">battery_full</span>
</div>
</div>
<header class="flex flex-col items-center justify-center pt-4 pb-6 px-6 shrink-0">
<div class="w-16 h-16 mb-3 relative">
<div class="absolute inset-0 bg-primary dark:bg-cream rounded-full opacity-10 blur-xl"></div>
<div class="w-full h-full relative z-10">
<svg class="w-full h-full drop-shadow-md" fill="none" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<circle class="fill-cream stroke-primary dark:stroke-cream stroke-4" cx="50" cy="50" r="45"></circle>
<path class="fill-secondary stroke-primary dark:stroke-cream stroke-4" d="M20 40C20 25 35 15 50 15C65 15 80 25 80 40"></path>
<path class="stroke-primary dark:stroke-background-dark stroke-4 fill-none" d="M35 55Q40 50 45 55" stroke-linecap="round"></path>
<path class="stroke-primary dark:stroke-background-dark stroke-4 fill-none" d="M55 55Q60 50 65 55" stroke-linecap="round"></path>
<path class="fill-none stroke-primary dark:stroke-background-dark stroke-4" d="M35 70Q50 80 65 70" stroke-linecap="round"></path>
<path class="fill-accent stroke-primary dark:stroke-background-dark stroke-2" d="M40 85L35 95H65L60 85"></path>
</svg>
</div>
</div>
<h1 class="font-display font-bold text-2xl text-primary dark:text-cream tracking-tight text-center">
            Mr. Restaurant
        </h1>
<p class="text-xs text-gray-500 dark:text-gray-300 tracking-widest uppercase font-semibold mt-1">Tu opinión nos importa</p>
</header>
<main class="flex-1 flex flex-col px-6 pb-8 justify-center max-w-md mx-auto w-full">
<div class="bg-white dark:bg-white/10 backdrop-blur-md rounded-2xl p-8 shadow-soft border border-gray-100 dark:border-white/5 mb-8">
<h2 class="font-display text-xl md:text-2xl text-gray-800 dark:text-white text-center leading-tight mb-2">
                ¿Qué tan probable es que recomiendes nuestro restaurante a un amigo o familiar?
            </h2>
<p class="text-center text-gray-400 dark:text-gray-400 text-sm mt-2">
                Selecciona una opción del 0 al 10
            </p>
</div>
<div class="grid grid-cols-6 gap-2 mb-6">
<button aria-label="Score 0" class="nps-btn aspect-square rounded-xl bg-white dark:bg-white/5 border border-gray-200 dark:border-white/10 text-gray-600 dark:text-gray-300 font-bold text-lg hover:bg-red-50 dark:hover:bg-red-900/20 hover:border-red-200 hover:text-red-600 transition-all duration-200 flex items-center justify-center shadow-sm">0</button>
<button aria-label="Score 1" class="nps-btn aspect-square rounded-xl bg-white dark:bg-white/5 border border-gray-200 dark:border-white/10 text-gray-600 dark:text-gray-300 font-bold text-lg hover:bg-red-50 dark:hover:bg-red-900/20 hover:border-red-200 hover:text-red-600 transition-all duration-200 flex items-center justify-center shadow-sm">1</button>
<button aria-label="Score 2" class="nps-btn aspect-square rounded-xl bg-white dark:bg-white/5 border border-gray-200 dark:border-white/10 text-gray-600 dark:text-gray-300 font-bold text-lg hover:bg-red-50 dark:hover:bg-red-900/20 hover:border-red-200 hover:text-red-600 transition-all duration-200 flex items-center justify-center shadow-sm">2</button>
<button aria-label="Score 3" class="nps-btn aspect-square rounded-xl bg-white dark:bg-white/5 border border-gray-200 dark:border-white/10 text-gray-600 dark:text-gray-300 font-bold text-lg hover:bg-orange-50 dark:hover:bg-orange-900/20 hover:border-orange-200 hover:text-orange-600 transition-all duration-200 flex items-center justify-center shadow-sm">3</button>
<button aria-label="Score 4" class="nps-btn aspect-square rounded-xl bg-white dark:bg-white/5 border border-gray-200 dark:border-white/10 text-gray-600 dark:text-gray-300 font-bold text-lg hover:bg-orange-50 dark:hover:bg-orange-900/20 hover:border-orange-200 hover:text-orange-600 transition-all duration-200 flex items-center justify-center shadow-sm">4</button>
<button aria-label="Score 5" class="nps-btn aspect-square rounded-xl bg-white dark:bg-white/5 border border-gray-200 dark:border-white/10 text-gray-600 dark:text-gray-300 font-bold text-lg hover:bg-yellow-50 dark:hover:bg-yellow-900/20 hover:border-yellow-200 hover:text-yellow-600 transition-all duration-200 flex items-center justify-center shadow-sm">5</button>
</div>
<div class="grid grid-cols-5 gap-3 mb-8">
<button aria-label="Score 6" class="nps-btn h-14 rounded-xl bg-white dark:bg-white/5 border border-gray-200 dark:border-white/10 text-gray-600 dark:text-gray-300 font-bold text-xl hover:bg-yellow-50 dark:hover:bg-yellow-900/20 hover:border-yellow-200 hover:text-yellow-600 transition-all duration-200 flex items-center justify-center shadow-sm">6</button>
<button aria-label="Score 7" class="nps-btn h-14 rounded-xl bg-white dark:bg-white/5 border border-gray-200 dark:border-white/10 text-gray-600 dark:text-gray-300 font-bold text-xl hover:bg-lime-50 dark:hover:bg-lime-900/20 hover:border-lime-200 hover:text-lime-600 transition-all duration-200 flex items-center justify-center shadow-sm">7</button>
<button aria-label="Score 8" class="nps-btn h-14 rounded-xl bg-white dark:bg-white/5 border border-gray-200 dark:border-white/10 text-gray-600 dark:text-gray-300 font-bold text-xl hover:bg-green-50 dark:hover:bg-green-900/20 hover:border-green-200 hover:text-green-600 transition-all duration-200 flex items-center justify-center shadow-sm">8</button>
<button aria-label="Score 9" class="nps-btn h-14 rounded-xl bg-white dark:bg-white/5 border border-gray-200 dark:border-white/10 text-gray-600 dark:text-gray-300 font-bold text-xl hover:bg-green-50 dark:hover:bg-green-900/20 hover:border-green-200 hover:text-green-600 transition-all duration-200 flex items-center justify-center shadow-sm">9</button>
<button aria-label="Score 10" class="selected nps-btn h-14 rounded-xl bg-primary dark:bg-cream border border-transparent text-cream dark:text-primary font-bold text-xl shadow-lg ring-2 ring-primary/20 dark:ring-cream/20 transition-all duration-200 flex items-center justify-center transform scale-105">10</button>
</div>
<div class="flex justify-between items-center text-xs font-bold uppercase tracking-wider text-gray-400 dark:text-gray-500 mb-8 px-1">
<span class="flex items-center gap-1 text-red-400">
<span class="material-icons text-base">thumb_down</span>
                Nada probable
            </span>
<span class="flex items-center gap-1 text-green-500">
                Muy probable
                <span class="material-icons text-base">thumb_up</span>
</span>
</div>
<div class="relative mb-6">
<label class="sr-only" for="comment">Comentario adicional</label>
<textarea class="w-full rounded-xl border-none bg-white dark:bg-white/5 text-gray-800 dark:text-white placeholder-gray-400 shadow-inner-soft p-4 resize-none focus:ring-2 focus:ring-primary dark:focus:ring-cream transition-all" id="comment" placeholder="¿Qué es lo que más te gustó? (Opcional)" rows="3"></textarea>
<div class="absolute bottom-3 right-3 text-gray-300 text-xs">
<span class="material-icons text-sm">edit</span>
</div>
</div>
</main>
<footer class="px-6 pb-8 pt-4 shrink-0 max-w-md mx-auto w-full">
<button class="w-full bg-primary text-cream font-display font-bold text-lg py-4 rounded-xl shadow-lg shadow-primary/30 hover:bg-secondary hover:shadow-secondary/30 active:scale-95 transition-all duration-300 flex items-center justify-center gap-2">
<span>Enviar Respuesta</span>
<span class="material-icons text-sm">arrow_forward</span>
</button>
<div class="mt-6 flex justify-center">
<div class="flex gap-2">
<div class="w-8 h-1.5 rounded-full bg-primary dark:bg-cream"></div>
<div class="w-2 h-1.5 rounded-full bg-gray-300 dark:bg-gray-600"></div>
<div class="w-2 h-1.5 rounded-full bg-gray-300 dark:bg-gray-600"></div>
</div>
</div>
</footer>
<div class="fixed top-0 left-0 w-full h-full pointer-events-none -z-10 overflow-hidden">
<div class="absolute -top-[10%] -right-[10%] w-[50%] h-[30%] bg-primary/5 dark:bg-cream/5 rounded-full blur-3xl"></div>
<div class="absolute top-[40%] -left-[10%] w-[30%] h-[30%] bg-accent/10 dark:bg-accent/5 rounded-full blur-3xl"></div>
</div>
<script>
        // Simple interactive script for selection visual feedback
        const buttons = document.querySelectorAll('.nps-btn');
        buttons.forEach(btn => {
            btn.addEventListener('click', function() {
                // Remove selected class from all
                buttons.forEach(b => {
                    b.classList.remove('selected', 'bg-primary', 'dark:bg-cream', 'text-cream', 'dark:text-primary', 'ring-2', 'scale-105', 'shadow-lg');
                    b.classList.add('bg-white', 'dark:bg-white/5', 'text-gray-600', 'dark:text-gray-300'); // Reset base styles
                });
                // Add selected class to clicked
                this.classList.remove('bg-white', 'dark:bg-white/5', 'text-gray-600', 'dark:text-gray-300');
                this.classList.add('selected', 'bg-primary', 'dark:bg-cream', 'text-cream', 'dark:text-primary', 'ring-2', 'ring-primary/20', 'dark:ring-cream/20', 'scale-105', 'shadow-lg');
            });
        });
    </script>

</body></html>
