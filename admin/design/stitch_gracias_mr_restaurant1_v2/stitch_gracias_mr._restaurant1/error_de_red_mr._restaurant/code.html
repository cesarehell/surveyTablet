<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Error de Red - Mr. Restaurant</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#36e27b",
                        "background-light": "#f6f8f7",
                        "background-dark": "#112117",
                    },
                    fontFamily: {
                        "display": ["Be Vietnam Pro", "Noto Sans", "sans-serif"],
                        "body": ["Be Vietnam Pro", "Noto Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark text-[#111714] dark:text-white transition-colors duration-200">
<div class="relative flex h-screen w-full flex-col group/design-root overflow-hidden">
<!-- Top App Bar -->
<header class="flex items-center px-4 py-4 justify-center relative shrink-0">
<!-- Left Icon (Hidden but kept for spacing balance if needed later) -->
<div class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 dark:text-gray-500">
<!-- Branding Icon -->
<span class="material-symbols-outlined text-[28px]">restaurant</span>
</div>
<h1 class="text-lg font-bold leading-tight tracking-[-0.015em] text-center">
                Mr. Restaurant
            </h1>
<!-- Right Icon (Status Indicator) -->
<div class="absolute right-4 top-1/2 -translate-y-1/2">
<div class="flex items-center gap-1.5 px-3 py-1.5 bg-red-100 dark:bg-red-900/30 rounded-full">
<div class="size-2 rounded-full bg-red-500 animate-pulse"></div>
<span class="text-xs font-bold text-red-700 dark:text-red-300 uppercase tracking-wide">Offline</span>
</div>
</div>
</header>
<!-- Main Content (Centered) -->
<main class="flex-1 flex flex-col items-center justify-center px-6 pb-12 w-full max-w-md mx-auto">
<!-- Visual / Icon Area -->
<div class="relative mb-8">
<!-- Decorative Circle Rings -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-48 h-48 bg-gray-200/50 dark:bg-white/5 rounded-full z-0"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-36 h-36 bg-gray-200 dark:bg-white/10 rounded-full z-0"></div>
<!-- Main Icon Container -->
<div class="relative z-10 flex items-center justify-center w-24 h-24 bg-white dark:bg-gray-800 shadow-xl rounded-full">
<span class="material-symbols-outlined text-[48px] text-red-500 dark:text-red-400">wifi_off</span>
</div>
<!-- Floating Question Mark (Decorative) -->
<div class="absolute -top-2 -right-2 z-20 bg-primary text-black rounded-full p-1.5 shadow-md flex items-center justify-center">
<span class="material-symbols-outlined text-[20px] font-bold">priority_high</span>
</div>
</div>
<!-- Text Content -->
<div class="flex flex-col items-center gap-3 text-center mb-10">
<h2 class="text-2xl md:text-3xl font-extrabold leading-tight tracking-tight text-[#111714] dark:text-white">
                    ¡Oh no! Sin conexión
                </h2>
<p class="text-base text-[#637587] dark:text-gray-400 font-normal leading-relaxed max-w-[320px]">
                    Parece que no hay internet. Revisa tu conexión Wi-Fi para que podamos enviar tus respuestas.
                </p>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-4 w-full">
<!-- Primary Button (Retry) -->
<button class="group relative flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-full h-14 bg-primary hover:bg-[#2dd16c] active:scale-[0.98] transition-all duration-200 shadow-lg shadow-primary/20">
<div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
<span class="material-symbols-outlined mr-2 text-[#111714]">refresh</span>
<span class="text-[#111714] text-lg font-bold leading-normal tracking-[0.015em] relative z-10">Reintentar</span>
</button>
<!-- Secondary Action (Settings/Help) -->
<button class="flex w-full cursor-pointer items-center justify-center rounded-full h-12 text-[#637587] dark:text-gray-400 font-semibold text-sm hover:bg-black/5 dark:hover:bg-white/5 transition-colors">
                    Ver configuración de red
                </button>
</div>
</main>
<!-- Bottom spacing filler -->
<div class="h-6"></div>
</div>
</body></html>
