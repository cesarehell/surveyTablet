<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Gracias - Mr. Restaurant</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&amp;family=Nunito:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#FF4133", // Red from hair
                        secondary: "#9AD29C", // Green from bowtie
                        accent: "#FBEFB6", // Cream from face
                        "brand-blue": "#0E4D71", // Dark blue from outlines/text
                        "background-light": "#F8FAFC", // Clean light bg
                        "background-dark": "#0B3954", // Deep blue bg matching brand feel
                        "surface-light": "#FFFFFF",
                        "surface-dark": "#134B6B",
                    },
                    fontFamily: {
                        display: ['"Fredoka"', 'sans-serif'], // Playful font for headings
                        body: ['"Nunito"', 'sans-serif'], // Readable font for text
                    },
                    borderRadius: {
                        DEFAULT: "1rem",
                        'xl': "1.5rem",
                        '2xl': "2rem",
                    },
                    animation: {
                        'bounce-slow': 'bounce 3s infinite',
                        'fade-in': 'fadeIn 0.8s ease-out forwards',
                        'scale-up': 'scaleUp 0.5s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        scaleUp: {
                            '0%': { transform: 'scale(0.8)', opacity: '0' },
                            '100%': { transform: 'scale(1)', opacity: '1' },
                        }
                    }
                },
            },
        };
    </script>
<style>body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col items-center justify-center p-6 relative overflow-hidden transition-colors duration-300 font-body">
<div class="absolute top-0 left-0 w-64 h-64 bg-accent/20 dark:bg-accent/5 rounded-full blur-3xl -translate-x-1/2 -translate-y-1/2 pointer-events-none"></div>
<div class="absolute bottom-0 right-0 w-80 h-80 bg-secondary/20 dark:bg-secondary/5 rounded-full blur-3xl translate-x-1/3 translate-y-1/3 pointer-events-none"></div>
<main class="w-full max-w-md bg-surface-light dark:bg-surface-dark shadow-xl dark:shadow-2xl rounded-2xl p-8 sm:p-12 text-center relative z-10 animate-fade-in border border-gray-100 dark:border-brand-blue/30 mx-auto">
<div class="mb-8 flex justify-center animate-scale-up delay-100">
<div class="relative w-24 h-24 flex items-center justify-center bg-secondary/20 dark:bg-secondary/10 rounded-full">
<span class="material-icons-round text-6xl text-secondary dark:text-secondary animate-bounce-slow">
                    check_circle
                </span>
<div class="absolute top-0 right-0 w-3 h-3 bg-primary rounded-full animate-ping opacity-75"></div>
<div class="absolute bottom-2 left-2 w-2 h-2 bg-brand-blue rounded-full animate-ping delay-75 opacity-75"></div>
</div>
</div>
<h1 class="font-display text-3xl sm:text-4xl font-bold text-brand-blue dark:text-white mb-4 leading-tight">
            ¡Muchas gracias!
        </h1>
<p class="text-gray-600 dark:text-gray-300 text-lg mb-8 leading-relaxed">
            Tu opinión ha sido enviada exitosamente. Valoramos mucho tu tiempo para ayudarnos a mejorar.
        </p>
<div class="w-16 h-1 bg-accent rounded-full mx-auto mb-8"></div>
<div class="flex flex-col items-center justify-center space-y-3 opacity-90 hover:opacity-100 transition-opacity">
<div class="flex items-center space-x-3">
<div class="w-12 h-12 relative flex-shrink-0">
<div class="absolute inset-0 bg-accent rounded-full border-2 border-brand-blue overflow-hidden">
<div class="absolute top-0 left-0 right-0 h-1/2 bg-primary rounded-b-lg transform -translate-y-1"></div>
<div class="absolute top-1/2 left-1/4 w-1.5 h-1.5 bg-brand-blue rounded-full"></div>
<div class="absolute top-1/2 right-1/4 w-1.5 h-1.5 bg-brand-blue rounded-full"></div>
<div class="absolute bottom-1/4 left-1/2 transform -translate-x-1/2 w-6 h-2 bg-brand-blue rounded-full"></div>
</div>
<div class="absolute -bottom-2 left-1/2 transform -translate-x-1/2 w-6 h-3 bg-secondary rounded flex items-center justify-center shadow-sm">
<div class="w-1.5 h-1.5 bg-brand-blue/20 rounded-full"></div>
</div>
</div>
<div class="text-left">
<h2 class="font-display font-bold text-xl text-brand-blue dark:text-white leading-none">
                        MR.
                    </h2>
<h2 class="font-display font-bold text-xl text-accent dark:text-accent leading-none tracking-wide" style="text-shadow: 1px 1px 0px rgba(14, 77, 113, 0.2);">
                        RESTAURANT
                    </h2>
</div>
</div>
<p class="text-xs font-bold text-secondary dark:text-secondary uppercase tracking-wider mt-1">
                Organiza tu cocina, disfruta tu servicio
            </p>
</div>
<div class="mt-10">
<button class="w-full bg-brand-blue hover:bg-brand-blue/90 text-white font-bold py-4 px-6 rounded-xl shadow-lg hover:shadow-xl transform active:scale-95 transition-all duration-200 flex items-center justify-center group" onclick="location.reload()">
<span>Volver al inicio</span>
<span class="material-icons-round ml-2 group-hover:translate-x-1 transition-transform text-sm">arrow_forward</span>
</button>
<p class="text-xs text-gray-400 dark:text-gray-500 mt-4">
                Redirigiendo en <span id="countdown">10</span> segundos...
            </p>
</div>
</main>
<footer class="absolute bottom-4 text-center w-full p-4 z-10">
<p class="text-xs text-gray-400 dark:text-gray-600">
            © 2024 Mr. Restaurant. Todos los derechos reservados.
        </p>
</footer>
<script>
        let timeLeft = 10;
        const countdownEl = document.getElementById('countdown');
        const timer = setInterval(() => {
            timeLeft--;
            if (countdownEl) countdownEl.innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timer);
                // In a real app, this would redirect
                console.log("Redirecting...");
            }
        }, 1000);
    </script>

</body></html>
